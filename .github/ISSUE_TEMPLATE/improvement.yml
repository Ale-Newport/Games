name: Improvement
description: Make an existing game, page or tool better (UX, accessibility, translations, content, performance, docs).
title: '[Improvement] '
labels: [improvement, needs triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A specific game
        - Library / navigation
        - AI Lab, agents or training bridge
        - Accessibility
        - Translations (English / Spanish)
        - Performance
        - Documentation
        - Tooling / CI
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game id (if applicable)
      placeholder: sokoban
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
    validations:
      required: true
  - type: textarea
    id: improved
    attributes:
      label: Suggested improvement
    validations:
      required: true
