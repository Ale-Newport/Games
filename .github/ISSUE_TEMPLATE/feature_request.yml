name: Feature request
description: Suggest a new platform feature, AI Lab capability or game mode.
title: '[Feature] '
labels: [enhancement, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas are welcome in [Discussions → Ideas](https://github.com/Ale-Newport/Games/discussions/categories/ideas) first.
        New games must use original names, art and levels (no trademarked titles or ripped assets).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who benefits (players, AI researchers, contributors) and how.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it should work. Mock-ups or rules references help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
